<title>Mood Garden · Cottage-garden mockups</title>

<style>
  :root{--serif:'Fraunces',Georgia,serif;--sans:'Figtree',system-ui,sans-serif;--moss:#5E7D4F}
  *{box-sizing:border-box} body{margin:0;background:#12161c;font-family:var(--sans);color:#3E4A38;overflow:hidden}
  .bar{position:fixed;z-index:20;top:0;left:0;right:0;height:56px;display:flex;gap:8px;align-items:center;justify-content:center;background:rgba(18,22,28,.92);padding:0 12px;flex-wrap:wrap}

  .wrap{position:fixed;inset:56px 0 0 0;display:grid;place-items:center;overflow:auto}
  .stage{position:relative;width:min(100vw,calc((100vh - 56px) * 1.6));aspect-ratio:1200/750;overflow:hidden;container-type:inline-size;background:#222}
  .stage svg.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
  .ov{position:absolute;inset:0;pointer-events:none}
  .brand{position:absolute;top:2.4cqw;left:2.6cqw;color:#fff;text-shadow:0 1px 12px rgba(0,0,0,.6)} .brand b{display:block;font:500 3cqw var(--serif)} .brand small{font-size:1.1cqw;letter-spacing:.12em;text-transform:uppercase;opacity:.9}

  .dock{position:absolute;bottom:2cqw;left:50%;transform:translateX(-50%);display:flex;align-items:flex-end;gap:.3cqw;padding:.7cqw 1.5cqw;border-radius:3.6cqw;background:linear-gradient(#FFFBEB,#F2E6C4);border:.35cqw solid #fff;box-shadow:0 .8cqw 2.4cqw rgba(0,0,0,.45)}
  .dock .d{width:6.6cqw;text-align:center;font-size:1.15cqw;color:#4B6B3F;font-weight:600;padding:.4cqw 0;border-radius:1.8cqw} .dock .d.on{background:rgba(120,180,90,.28)} .dock svg{width:2.8cqw;height:2.8cqw;display:block;margin:0 auto 2px}

  .toast{position:absolute;left:50%;transform:translateX(-50%);top:8cqw;max-width:46%;padding:1.2cqw 2.2cqw;border-radius:2cqw;background:#F5EEDC;box-shadow:0 1cqw 3cqw rgba(0,0,0,.4);font:1.55cqw/1.4 var(--serif);text-align:center} .toast b{display:block;font:600 1cqw var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--moss)}
  .pin{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:.5cqw;pointer-events:none}

  .pin span{background:rgba(247,240,223,.96);padding:.4cqw 1cqw;border-radius:1.4cqw;font:italic 1.25cqw var(--serif);box-shadow:0 .3cqw 1cqw rgba(0,0,0,.4);white-space:nowrap}
  .scrim{position:absolute;inset:0;background:rgba(10,16,30,.5);backdrop-filter:blur(2px)} .sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58%;background:#F5EEDC;border-radius:2.4cqw;padding:2.6cqw 3cqw;box-shadow:0 3cqw 7cqw rgba(0,0,0,.55)}

  .btn{display:inline-block;border-radius:3cqw;padding:.8cqw 2.4cqw;font:1.7cqw var(--serif);color:#fbf6e8;background:radial-gradient(circle at 35% 25%,#8FB27A,#4F7A44 75%);box-shadow:0 .5cqw 1.2cqw rgba(30,60,30,.5),0 0 0 .25cqw #F7F0DF}
  .grid{position:absolute;inset:0;padding:12px;grid-template-columns:repeat(3,1fr);gap:12px;overflow:auto;align-content:start} .mini{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:1.6;background:#222} .mini svg{position:absolute;inset:0;width:100%;height:100%} .mini b{position:absolute;left:12px;bottom:26px;color:#fff;font:500 22px var(--serif);text-shadow:0 2px 10px rgba(0,0,0,.7)} .mini small{position:absolute;left:12px;bottom:10px;color:#fff;font-size:13px;text-shadow:0 1px 8px rgba(0,0,0,.7)}
  .cap{position:fixed;z-index:20;left:12px;bottom:10px;max-width:420px;background:rgba(18,22,28,.82);color:#dfe8d8;font-size:13px;line-height:1.45;padding:10px 14px;border-radius:12px}
  @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}} .tw{animation:tw 3s infinite} @keyframes fl{0%,100%{opacity:.7}50%{opacity:1}} .fl{animation:fl 3.5s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}} .sw{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
  @keyframes drift{0%{transform:translate(0,0)}100%{transform:translate(40px,-30px)}} .dr{animation:drift 8s ease-in-out infinite alternate} @keyframes fall{from{transform:translate(0,-20px) rotate(0)}to{transform:translate(90px,800px) rotate(360deg)}} .petal{animation:fall linear infinite}
  @keyframes smoke{0%{transform:translate(0,0) scale(.5);opacity:0}25%{opacity:.5}100%{transform:translate(20px,-70px) scale(2);opacity:0}} .smoke{animation:smoke 6s ease-out infinite}

 s+=`<g opacity="${(1-lit).toFixed(2)}">${sparkle(24,0,1200,300,740,'#FFF2C0',4)}</g>`+petals(lit>.5?4:10,5,['#F7C9CF','#FFE6A0'])+`<rect width="1200" height="750" fill="url(#vg)"/>`;
 return s}

/* ================== PAGE ================== */
const PRESETS=[['Dawn',6.3],['Morning',8.5],['Midday',13],['Golden hour',17.3],['Dusk',19.3],['Night',22]];
const PINS=[[600,120,'The cottage door · journal'],[930,360,'Fountain · breathing pond'],[330,600,'Flower rows · new feelings plant here'],[600,720,'The gate · explore other places'],[1040,520,'Rose beds · gratitude & love']];
const CAPS={Dawn:'Dawn. Soft pink light, lamps still glowing as the garden wakes. Dew and a quiet first check-in.',Morning:'Morning. Fresh, bright greens and long low sunbeams across the path.',Midday:'Midday. Full colour, lamps off, the pompom rows at their brightest.',"Golden hour":'Golden hour. Warm amber light; the lamps begin to come on.',Dusk:'Dusk. Rose and violet light, windows and lanterns glowing, first fireflies.',Night:'Night. Lit windows, glowing pools of light on the cobbles, fireflies and moonlight.'};
const GREET=h=>{const p=phaseName(h);return p==='Night'?'The garden is quiet tonight. Nothing wilted while you were away.':p==='Dawn'?'Good morning. The garden is just waking up.':p==='Dusk'||p==='Golden hour'?'Good evening. Nothing wilted while you were away.':'Welcome back. Nothing wilted while you were away.'};
const ic=`<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 27V15M16 20c-6 0-9-4-9-9 6 0 9 3 9 9ZM16 15c0-5 3-8 9-8 0 5-4 8-9 8ZM8 27h16"/></svg>`;
const dockH=`<div class="dock"><div class="d on">${ic}Garden</div><div class="d">${ic}Journal</div><div class="feel">${ic}How are<br>you feeling?</div><div class="d">${ic}Memories</div><div class="d">${ic}Collection</div><div class="d">${ic}Explore</div></div>`;
const EM=[['Joy','sunflower'],['Calm','lav'],['Sadness','bell'],['Anxiety','fern'],['Anger','poppy'],['Tiredness','moon'],['Loneliness','puff'],['Excitement','cosmos'],['Gratitude','daisy'],['Confusion','vine'],['Hope','sprout'],['Neutral','hosta']];
const ciH=`<div class="scrim"></div><div class="sheet"><div class="e">A moment with the garden</div><h3>What is blooming in you?</h3><p>Choose as many as feel true. Each one will find a place in the garden.</p><div class="bg">${EM.map(([l,f],i)=>`<div class="bl ${[0,1,10].includes(i)?'sel':''}" style="--c:${['#C98D1F','#7B6BA3','#9DB45A'][[0,1,10].indexOf(i)]||'#ccc'}"><svg viewBox="-34 -78 68 88"><use href="#${f}"/></svg>${l}</div>`).join('')}</div><div style="text-align:right;margin-top:1.4cqw"><span class="btn">Continue</span></div></div>`;
let hour=13,showUI=true,showPins=false,showCI=false,overview=false;
const stage=document.getElementById('stage'),cap=document.getElementById('cap'),grid=document.getElementById('grid'),rng=document.getElementById('hr'),lab=document.getElementById('hlab');
const uniq=(str,t)=>{const ids=[...new Set([...str.matchAll(/id="([^"]+)"/g)].map(m=>m[1]))];ids.forEach(id=>{str=str.split(`id="${id}"`).join(`id="${id}-${t}"`).split(`#${id})`).join(`#${id}-${t})`)});return str};
function render(){const p=phaseName(hour);lab.textContent=`${fmtH(hour)} · ${p}`;rng.value=hour;cap.textContent=CAPS[p];
 document.querySelectorAll('.bar button[data-h]').forEach(b=>b.classList.toggle('on',!overview&&phaseName(+b.dataset.h)===p));
 if(overview){stage.style.display='none';grid.style.display='grid';grid.innerHTML=PRESETS.map(([n,h])=>`<div class="mini"><svg viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice">${uniq(scene2(h),n.replace(/\W/g,''))}</svg><b>${n}</b><small>${fmtH(h)}</small></div>`).join('');cap.textContent='All stages of the day, dawn to night. Light, lamps, windows and fireflies shift continuously with the slider.';return}
 grid.style.display='none';stage.style.display='block';
 stage.innerHTML=`<svg class="scene" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice">${scene2(hour)}</svg><div class="ov">${showUI?`<div class="brand"><b>Mood Garden</b><small>Saturday · autumn · ${fmtH(hour)}</small></div><div class="pill">☀ Atmosphere</div>${showCI?'':`<div class="toast"><b>${p}</b>${GREET(hour)}</div>`}${dockH}`:''}${showPins?PINS.map(([x,y,t],i)=>`<div class="pin" style="left:${x/12}%;top:${y/7.5}%"><i>${i+1}</i><span>${t}</span></div>`).join(''):''}${showCI?ciH:''}</div>`}
document.querySelectorAll('.bar button').forEach(b=>b.onclick=()=>{if(b.dataset.h!==undefined){hour=+b.dataset.h;overview=false;document.querySelector('[data-t=ov]').classList.remove('on')}else{const t=b.dataset.t;if(t==='ui')showUI=!showUI;if(t==='pins')showPins=!showPins;if(t==='ci')showCI=!showCI;if(t==='ov')overview=!overview;b.classList.toggle('on',t==='ui'?showUI:t==='pins'?showPins:t==='ci'?showCI:overview)}render()});
rng.oninput=()=>{hour=+rng.value;overview=false;document.querySelector('[data-t=ov]').classList.remove('on');render()};
render();
</script></body></html>
