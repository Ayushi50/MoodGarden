<script>
let seed=1;const R=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};const rs=s=>{seed=s};const rr=(a,b)=>a+R()*(b-a);
/* ---------- geometry ---------- */
const SURF=[[[190,392],[186,330],[250,268],[340,238]],[[340,238],[430,208],[520,198],[610,200]],[[610,200],[720,202],[830,214],[900,250]],[[900,250],[976,290],[1018,340],[1012,392]],[[1012,392],[1004,440],[940,470],[860,486]],[[860,486],[760,506],[640,512],[520,506]],[[520,506],[400,500],[290,480],[232,444]],[[232,444],[204,428],[192,412],[190,392]]];
const bz=(s,t)=>{const u=1-t;return[u*u*u*s[0][0]+3*u*u*t*s[1][0]+3*u*t*t*s[2][0]+t*t*t*s[3][0],u*u*u*s[0][1]+3*u*u*t*s[1][1]+3*u*t*t*s[2][1]+t*t*t*s[3][1]]};
const SURF_D='M190 392 '+SURF.map(s=>`C${s[1]} ${s[2]} ${s[3]}`).join(' ')+'Z';
const ROCKSEG=[[[190,392],[196,470],[250,540],[320,590]],[[320,590],[380,640],[430,690],[500,722]],[[500,722],[540,744],[575,758],[610,764]],[[610,764],[650,758],[690,736],[730,704]],[[730,704],[800,650],[870,610],[930,550]],[[930,550],[985,496],[1010,440],[1012,392]]];
const ROCK_D=(()=>{rs(77);const pts=ROCKSEG.flatMap(sg=>Array.from({length:9},(_,i)=>bz(sg,i/9)));pts.push([1012,392]);const spikes={14:34,20:46,27:30,33:52,40:38,46:28,52:22};return 'M190 392 '+pts.map(([x,y],i)=>{if(i===0||i===pts.length-1)return `L${x} ${y}`;const j=rr(-7,7);const sp=spikes[i]||0;return `L${(x+j+(sp?(x<610?-sp*.25:sp*.25):0)).toFixed(0)} ${(y+rr(-5,5)+sp).toFixed(0)}`}).join(' ')+'Z'})();
const POLY=SURF.flatMap(s=>Array.from({length:12},(_,i)=>bz(s,i/12)));
const inside=(x,y,k=1)=>{const cx=600,cy=355;const px=cx+(x-cx)/k,py=cy+(y-cy)/k;let c=false;for(let i=0,j=POLY.length-1;i<POLY.length;j=i++){const[xi,yi]=POLY[i],[xj,yj]=POLY[j];if((yi>py)!=(yj>py)&&px<(xj-xi)*(py-yi)/(yj-yi)+xi)c=!c}return c};
const FRONT=(n,from=0)=>{const segs=SURF.slice(4);const o=[];for(let i=0;i<n;i++){const f=(from+i/(n-1))*segs.length;const k=Math.min(segs.length-1,Math.floor(f));o.push(bz(segs[k],f-k))}return o};
const PATH_T=[[600,505],[626,462],[668,424],[722,382],[772,330]];
